<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topbar">
    <button class="text-btn" id="logout" style="visibility:hidden" data-i18n="logout"></button>
    <span class="topbar-title" data-i18n="bookings"></span>
    <button class="lang-toggle" data-i18n="langButton"></button>
  </nav>

  <main class="container">
    <!-- Login -->
    <form id="login-form" class="card">
      <h2 class="shop-name"></h2>
      <label><span data-i18n="email"></span> <input type="email" id="email" dir="ltr" required></label>
      <label><span data-i18n="password"></span> <input type="password" id="password" dir="ltr" required></label>
      <button type="submit" data-i18n="login"></button>
      <p id="login-error" class="message error"></p>
    </form>

    <!-- Bookings -->
    <div id="dashboard" style="display:none">
      <div class="card filters">
        <label><span data-i18n="day"></span> <input type="date" id="filter-date"></label>
        <label><span data-i18n="branch"></span> <select id="filter-branch"></select></label>
        <label class="checkbox"><input type="checkbox" id="filter-upcoming"> <span data-i18n="showUpcoming"></span></label>
      </div>
      <p id="count" class="count"></p>
      <div id="list"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="admin.js"></script>
</body>
</html>
